<div class="calc-grid">
  <div class="field"><label for="length">Patio Length (ft)</label><input type="number" id="length" inputmode="decimal" placeholder="e.g. 12" min="0" step="0.01"></div>
  <div class="field"><label for="width">Patio Width (ft)</label><input type="number" id="width" inputmode="decimal" placeholder="e.g. 10" min="0" step="0.01"></div>
  <div class="field"><label for="paverlen">Paver Length (in)</label><input type="number" id="paverlen" inputmode="decimal" placeholder="e.g. 12" min="0" step="0.1"></div>
  <div class="field"><label for="paverwid">Paver Width (in)</label><input type="number" id="paverwid" inputmode="decimal" placeholder="e.g. 12" min="0" step="0.1"></div>
  <div class="field"><label for="waste">Waste / Cut Allowance (%)</label><input type="number" id="waste" inputmode="decimal" value="10" min="0" step="1"></div>
</div>
<div class="calc-actions"><button class="btn-calc" id="calcBtn">Calculate Pavers Needed</button></div>
<div class="result" id="result">
  <div class="big" id="mainResult">0 pavers</div>
  <div class="sub" id="resultSub">Covers 0 ft² · Paver area: 0 ft²</div>
</div>
