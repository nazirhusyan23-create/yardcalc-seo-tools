<div class="calc-grid">
  <div class="field"><label for="diameter">Hole Diameter (in)</label><input type="number" id="diameter" inputmode="decimal" placeholder="e.g. 10" min="0" step="0.5"></div>
  <div class="field"><label for="depth">Hole Depth (in)</label><input type="number" id="depth" inputmode="decimal" placeholder="e.g. 24" min="0" step="0.5"></div>
  <div class="field"><label for="numholes">Number of Holes</label><input type="number" id="numholes" inputmode="numeric" placeholder="e.g. 6" min="1" step="1" value="1"></div>
  <div class="field"><label for="bagsize">Bag Size</label>
    <select id="bagsize">
      <option value="0.60">80 lb bag (0.60 ft³ yield)</option>
      <option value="0.45">60 lb bag (0.45 ft³ yield)</option>
      <option value="0.375">50 lb bag (0.375 ft³ yield)</option>
      <option value="0.30">40 lb bag (0.30 ft³ yield)</option>
    </select>
  </div>
</div>
<div class="calc-actions"><button class="btn-calc" id="calcBtn">Calculate Bags Needed</button></div>
<div class="result" id="result">
  <div class="big" id="mainResult">0 bags</div>
  <div class="sub" id="resultSub">Total volume: 0 ft³ across 0 holes</div>
</div>
