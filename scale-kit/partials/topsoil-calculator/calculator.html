<div class="calc-grid">
  <div class="field"><label for="length">Area Length (ft)</label><input type="number" id="length" inputmode="decimal" placeholder="e.g. 25" min="0" step="0.01"></div>
  <div class="field"><label for="width">Area Width (ft)</label><input type="number" id="width" inputmode="decimal" placeholder="e.g. 12" min="0" step="0.01"></div>
  <div class="field"><label for="depth">Depth (inches)</label><input type="number" id="depth" inputmode="decimal" placeholder="e.g. 4" min="0" step="0.25"></div>
</div>
<div class="calc-actions"><button class="btn-calc" id="calcBtn">Calculate Topsoil Needed</button></div>
<div class="result" id="result">
  <div class="big" id="mainResult">0 yd³</div>
  <div class="sub" id="resultSub">Approx. 0 tons · 0 ft³</div>
</div>
