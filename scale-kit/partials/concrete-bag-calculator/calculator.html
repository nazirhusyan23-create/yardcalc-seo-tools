<div class="calc-grid">
  <div class="field">
    <label for="length">Length</label>
    <input type="number" id="length" inputmode="decimal" placeholder="e.g. 10" min="0" step="0.01">
  </div>
  <div class="field">
    <label for="width">Width</label>
    <input type="number" id="width" inputmode="decimal" placeholder="e.g. 8" min="0" step="0.01">
  </div>
  <div class="field">
    <label for="thickness">Thickness (inches)</label>
    <input type="number" id="thickness" inputmode="decimal" placeholder="e.g. 4" min="0" step="0.25">
  </div>
  <div class="field">
    <label for="bagsize">Bag Size</label>
    <select id="bagsize">
      <option value="0.60">80 lb bag (0.60 ft³ yield)</option>
      <option value="0.45">60 lb bag (0.45 ft³ yield)</option>
      <option value="0.375">50 lb bag (0.375 ft³ yield)</option>
      <option value="0.30">40 lb bag (0.30 ft³ yield)</option>
    </select>
  </div>
</div>

<div class="calc-actions">
  <button class="btn-calc" id="calcBtn">Calculate Bags Needed</button>
</div>

<div class="result" id="result">
  <div class="big" id="bagCount">0 bags</div>
  <div class="sub" id="resultSub">Total volume: 0 ft³ (0 yd³)</div>
</div>
