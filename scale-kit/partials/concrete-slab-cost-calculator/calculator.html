<div class="calc-grid">
  <div class="field"><label for="length">Slab Length (ft)</label><input type="number" id="length" inputmode="decimal" placeholder="e.g. 20" min="0" step="0.01"></div>
  <div class="field"><label for="width">Slab Width (ft)</label><input type="number" id="width" inputmode="decimal" placeholder="e.g. 20" min="0" step="0.01"></div>
  <div class="field"><label for="thickness">Thickness (in)</label><input type="number" id="thickness" inputmode="decimal" placeholder="e.g. 4" min="0" step="0.25"></div>
  <div class="field"><label for="priceperyard">Ready-Mix Price ($ per yd³)</label><input type="number" id="priceperyard" inputmode="decimal" placeholder="e.g. 150" min="0" step="1"></div>
</div>
<div class="calc-actions"><button class="btn-calc" id="calcBtn">Estimate Slab Cost</button></div>
<div class="result" id="result">
  <div class="big" id="mainResult">$0</div>
  <div class="sub" id="resultSub">Volume: 0 yd³ (0 ft³)</div>
</div>
