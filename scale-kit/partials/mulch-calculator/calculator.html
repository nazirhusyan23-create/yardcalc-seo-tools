<div class="calc-grid">
  <div class="field"><label for="length">Bed Length (ft)</label><input type="number" id="length" inputmode="decimal" placeholder="e.g. 15" min="0" step="0.01"></div>
  <div class="field"><label for="width">Bed Width (ft)</label><input type="number" id="width" inputmode="decimal" placeholder="e.g. 6" min="0" step="0.01"></div>
  <div class="field"><label for="depth">Depth (inches)</label><input type="number" id="depth" inputmode="decimal" placeholder="e.g. 3" min="0" step="0.25"></div>
  <div class="field"><label for="bagsize">Bag Size</label>
    <select id="bagsize">
      <option value="2">2 cu ft bag</option>
      <option value="3">3 cu ft bag</option>
    </select>
  </div>
</div>
<div class="calc-actions"><button class="btn-calc" id="calcBtn">Calculate Mulch Needed</button></div>
<div class="result" id="result">
  <div class="big" id="mainResult">0 yd³</div>
  <div class="sub" id="resultSub">Approx. 0 bags</div>
</div>
