<div class="calc-grid">
  <div class="field"><label for="length">Lawn Length (ft)</label><input type="number" id="length" inputmode="decimal" placeholder="e.g. 40" min="0" step="0.01"></div>
  <div class="field"><label for="width">Lawn Width (ft)</label><input type="number" id="width" inputmode="decimal" placeholder="e.g. 30" min="0" step="0.01"></div>
  <div class="field"><label for="waste">Waste Allowance (%)</label><input type="number" id="waste" inputmode="decimal" value="5" min="0" step="1"></div>
</div>
<div class="calc-actions"><button class="btn-calc" id="calcBtn">Calculate Sod Needed</button></div>
<div class="result" id="result">
  <div class="big" id="mainResult">0 pallets</div>
  <div class="sub" id="resultSub">Approx. 0 individual pieces · 0 ft² total</div>
</div>
